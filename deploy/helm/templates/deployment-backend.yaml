{{- if .Values.backend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eks-web-cli.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "eks-web-cli.name" . }}-backend
    helm.sh/chart: {{ include "eks-web-cli.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "eks-web-cli.name" . }}-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "eks-web-cli.name" . }}-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: {{ .Values.backend.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http-backend
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: DEFAULT_NAMESPACE
              value: "{{ .Values.backend.config.defaultNamespace | default "ns-4" }}"
            - name: JWT_EXPIRATION_HOURS
              value: "{{ .Values.backend.config.jwtExpirationHours }}"
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
{{- end }}
