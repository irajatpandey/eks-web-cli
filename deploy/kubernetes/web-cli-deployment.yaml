# ==============================================================================
# Backend Deployment & Service (FastAPI + Diagnostic kubectl)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-web-cli-backend
  namespace: ns-4
  labels:
    app.kubernetes.io/name: eks-web-cli
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: eks-web-cli
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-web-cli
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/eks-web-cli-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-backend
          env:
            - name: DEFAULT_NAMESPACE
              value: "ns-4"
            - name: JWT_EXPIRATION_HOURS
              value: "8"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-backend
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-backend
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eks-web-cli-backend
  namespace: ns-4
  labels:
    app.kubernetes.io/name: eks-web-cli
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http-backend
      protocol: TCP
      name: http-backend
  selector:
    app.kubernetes.io/name: eks-web-cli
    app.kubernetes.io/component: backend
---
# ==============================================================================
# Frontend Deployment & Service (Alpine Nginx + Static Terminal Web UI)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-web-cli-frontend
  namespace: ns-4
  labels:
    app.kubernetes.io/name: eks-web-cli
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: eks-web-cli
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-web-cli
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/eks-web-cli-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http-frontend
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-frontend
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-frontend
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eks-web-cli-frontend
  namespace: ns-4
  labels:
    app.kubernetes.io/name: eks-web-cli
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http-frontend
      protocol: TCP
      name: http-frontend
  selector:
    app.kubernetes.io/name: eks-web-cli
    app.kubernetes.io/component: frontend
---
# ==============================================================================
# Ingress (Routes public HTTPS traffic to Frontend)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-web-cli-ingress
  namespace: ns-4
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
spec:
  rules:
    - host: cli.eks.company.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-web-cli-frontend
                port:
                  number: 80
